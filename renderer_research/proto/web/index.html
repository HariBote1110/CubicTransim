<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quarter-view WebGPU Renderer Prototype</title>
  <script type="module" src="/src/main.js"></script>
  <style>
    html, body, #app { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #14171b; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    canvas { width: 100%; height: 100%; display: block; cursor: grab; }
    canvas.dragging { cursor: grabbing; }
    #hud { position: fixed; left: 12px; top: 12px; white-space: pre; color: #f5f5f5; background: rgba(10,12,14,.78); padding: 10px 12px; border-radius: 8px; font-size: 12px; line-height: 1.45; pointer-events: none; }
    #help { position: fixed; right: 12px; bottom: 12px; color: #eee; background: rgba(10,12,14,.7); padding: 8px 10px; border-radius: 8px; font-size: 12px; }
    #error { position: fixed; inset: 0; display: none; place-items: center; color: #fff; background: #241b1b; padding: 3rem; text-align: center; }
  </style>
</head>
<body>
  <div id="app"><canvas id="view"></canvas></div>
  <div id="hud">booting…</div>
  <div id="help">drag: pan / wheel: zoom / 0: full map / 1: 1 cell ≈ 100px</div>
  <div id="error"></div>
</body>
</html>
